name: Cleanup Workflow Runs

# Runs once a day and deletes any completed workflow run that did NOT result
# in a real addon deployment.  Keeps the full history of successful
# "Deploy Stable" and "Deploy Alpha" runs so release history is preserved.

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily
  workflow_dispatch:

permissions:
  actions: write   # required to delete workflow runs

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete non-deploy workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          KEEP_THIS_RUN: ${{ github.run_id }}
        run: |
          # Workflow display names whose SUCCESSFUL runs should be kept.
          # All other completed runs (regardless of conclusion) are deleted.
          KEEP_NAMES=("Deploy Stable" "Deploy Alpha")

          echo "Fetching all completed workflow runs..."

          # --paginate iterates through all pages; -q outputs one TSV line per run.
          gh api "repos/$REPO/actions/runs?per_page=100&status=completed" \
              --paginate \
              -q '.workflow_runs[] | [(.id | tostring), .name, (.conclusion // "null")] | @tsv' \
          | while IFS=$'\t' read -r run_id run_name conclusion; do

              # Never delete the current cleanup run (it's still completing).
              if [[ "$run_id" == "$KEEP_THIS_RUN" ]]; then
                  echo "SKIP  (self)         [$run_id] $run_name"
                  continue
              fi

              # Check if this run is one of the keeper workflows with a
              # successful conclusion.
              keep=false
              for keeper in "${KEEP_NAMES[@]}"; do
                  if [[ "$run_name" == "$keeper" && "$conclusion" == "success" ]]; then
                      keep=true
                      break
                  fi
              done

              if [[ "$keep" == "true" ]]; then
                  echo "KEEP  ($conclusion)  [$run_id] $run_name"
              else
                  echo "DELETE ($conclusion) [$run_id] $run_name"
                  gh api -X DELETE "repos/$REPO/actions/runs/$run_id" \
                      --silent || echo "  (already gone or permission denied)"
              fi
          done

          echo "Cleanup complete."
