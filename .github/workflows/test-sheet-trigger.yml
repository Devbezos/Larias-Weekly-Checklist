name: "[TEST] Sheet Trigger → Locales Dispatch"

# ─── Triggers ─────────────────────────────────────────────────────────────────
# 1. Fired by Google Apps Script in the spreadsheet via repository_dispatch.
# 2. Can also be triggered manually from the Actions tab.
on:
  repository_dispatch:
    types: [sheet-test]

  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest

    steps:
      - name: Log trigger source
        run: |
          echo "Event type : ${{ github.event_name }}"
          echo "Dispatch type: ${{ github.event.action }}"
          echo "Payload      : ${{ toJson(github.event.client_payload) }}"

      - name: Dispatch to locales repo
        env:
          LOCALES_REPO_TOKEN: ${{ secrets.LOCALES_REPO_TOKEN }}
        run: |
          RESPONSE=$(curl -sL -w "\n%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${LOCALES_REPO_TOKEN}" \
            https://api.github.com/repos/Devbezos/Larias-Weekly-Midnight-Checklist_Locales/dispatches \
            -d '{"event_type":"sheet-test","client_payload":{"source":"main-repo-test"}}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_CODE"
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Dispatch to locales repo sent successfully."
          else
            echo "ERROR: dispatch failed (HTTP $HTTP_CODE)"
            echo "Response body: $BODY"
            exit 1
          fi
