name: Update Sheet Data + Upload to CurseForge & Wago

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # runs every hour on the hour (UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          set -euo pipefail
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

      - name: Convert CSV to Lua
        run: |
          python scripts/sheet_to_lua.py data/spreadsheet.csv Locales/enUS_Data.lua

      - name: Commit + bump version + tag (only if Lua changed)
        id: commitstep
        run: |
          set -euo pipefail

          if git diff --quiet -- Locales/enUS_Data.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOC="LariasWeeklyMidnightChecklist.toc"

          CURRENT_VERSION=$(python -c "import re; t=open('$TOC').read(); m=re.search(r'Version:\\s*(\\d+)\\.(\\d+)\\.(\\d+)', t); print('.'.join(m.groups()))")
          IFS='.' read MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
          TAG="v$NEW_VERSION"

          python -c "import re; p='$TOC'; t=open(p).read(); t=re.sub(r'Version:.*', 'Version: $NEW_VERSION', t); open(p,'w').write(t)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Locales/enUS_Data.lua "$TOC"
          git commit -m "Auto-update checklist data ($TAG)"
          git push

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package + Upload (CurseForge & Wago)
        if: steps.commitstep.outputs.changed == 'true'
        uses: BigWigsMods/packager@v2.4.3
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Notify Discord (release posted)
        if: steps.commitstep.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.commitstep.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          CURSE_URL="https://www.curseforge.com/wow/addons/larias-weekly-midnight-checklist"

          payload=$(cat <<EOF
          {
            "content": "🚀 **Larias Weekly Midnight Checklist ${TAG}** is live!\n\n📦 GitHub: ${RELEASE_URL}\n🔥 CurseForge: ${CURSE_URL}\n🛠 Workflow: ${RUN_URL}"
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
