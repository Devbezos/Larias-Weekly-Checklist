name: Update Sheet Data and Upload to Wago

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required so tags work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

          if head -n 5 data/spreadsheet.csv | grep -qi "<html"; then
            echo "ERROR: Sheet not public or auth required."
            exit 1
          fi

      - name: Convert CSV to Lua
        run: |
          python scripts/sheet_to_lua.py data/spreadsheet.csv LariasWeeklyMidnightChecklist_Data.lua

      - name: Commit if Lua changed
        id: commitstep
        run: |
          if git diff --quiet -- LariasWeeklyMidnightChecklist_Data.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add LariasWeeklyMidnightChecklist_Data.lua
          git commit -m "Auto-update checklist from Google Sheets"
          git push

      - name: Tag release (stable)
        if: steps.commitstep.outputs.changed == 'true'
        run: |
          VERSION="v1.0.0-$(date -u +%Y.%m.%d)"
          git tag -a "$VERSION" -m "Automated release $VERSION"
          git push origin "$VERSION"

      - name: Package & Upload to Wago
        if: steps.commitstep.outputs.changed == 'true'
        uses: BigWigsMods/packager@v2
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
