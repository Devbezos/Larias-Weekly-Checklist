name: Update Sheet Data and Upload to Wago

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

          if head -n 5 data/spreadsheet.csv | grep -qi "<html"; then
            echo "ERROR: Sheet not public or auth required."
            exit 1
          fi

      - name: Convert CSV to Lua
        run: |
          python scripts/sheet_to_lua.py data/spreadsheet.csv LariasWeeklyMidnightChecklist_Data.lua

      - name: Commit, bump version, tag, and upload
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          if git diff --quiet -- LariasWeeklyMidnightChecklist_Data.lua; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump patch version in .toc
          VERSION_LINE=$(grep "^## Version:" LariasWeeklyMidnightChecklist.toc)
          CURRENT_VERSION=${VERSION_LINE##*: }
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"

          sed -i "s/^## Version:.*/## Version: $NEW_VERSION/" LariasWeeklyMidnightChecklist.toc

          git add LariasWeeklyMidnightChecklist_Data.lua LariasWeeklyMidnightChecklist.toc
          git commit -m "Auto-update checklist data (v$NEW_VERSION)"
          git push

          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

          # Package & upload to Wago (stable because tag has no hyphen)
          npx --yes @bigwigs/packager
