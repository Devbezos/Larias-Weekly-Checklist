name: Update Sheet Data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

      - name: Convert to Lua
        run: |
          python scripts/sheet_to_lua.py data/spreadsheet.csv LariasWeeklyMidnightChecklist_Data.lua

      - name: Commit if changed
        run: |
          if git diff --quiet -- LariasWeeklyMidnightChecklist_Data.lua; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add LariasWeeklyMidnightChecklist_Data.lua
          git commit -m "Auto-update checklist from Google Sheets"
          git push
