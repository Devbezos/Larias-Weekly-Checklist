name: Update Sheet Data + Upload to Wago

on:
  workflow_dispatch:
  schedule:
     - cron: "0 15 * * *"  # 10:00 AM EST
     - cron: "0 23 * * *"  # 6:00 PM EST

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          set -euo pipefail
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" -o data/spreadsheet.csv
          if head -n 5 data/spreadsheet.csv | grep -qi "<html"; then
            echo "ERROR: Sheet not public or auth required."
            exit 1
          fi

      - name: Convert CSV to Lua
        run: |
          set -euo pipefail
          python scripts/sheet_to_lua.py data/spreadsheet.csv LariasWeeklyMidnightChecklist_Data.lua

      - name: Commit + bump version + tag (only if Lua changed)
        id: commitstep
        run: |
          set -euo pipefail

          if git diff --quiet -- LariasWeeklyMidnightChecklist_Data.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes. Nothing to release."
            exit 0
          fi

          TOC="LariasWeeklyMidnightChecklist.toc"
          CURRENT_VERSION=$(python -c "import re; t=open('$TOC','r',encoding='utf-8',errors='ignore').read().replace('\r',''); m=re.search(r'^##\\s*Version:\\s*(\\d+)\\.(\\d+)\\.(\\d+)', t, re.M); print('.'.join(m.groups()) if m else '1.0.0')")
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
          TAG="v$NEW_VERSION"

          echo "Bumping version: $CURRENT_VERSION -> $NEW_VERSION"

          python -c "import re; p='$TOC'; t=open(p,'r',encoding='utf-8',errors='ignore').read().replace('\r',''); t=re.sub(r'^##\\s*Version:.*$', '## Version: $NEW_VERSION', t, flags=re.M); open(p,'w',encoding='utf-8',newline='\\n').write(t)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add LariasWeeklyMidnightChecklist_Data.lua "$TOC"
          git commit -m "Auto-update checklist data (v$NEW_VERSION)"
          git push

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Package & Upload to Wago
        if: steps.commitstep.outputs.changed == 'true'
        uses: BigWigsMods/packager@v2
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
