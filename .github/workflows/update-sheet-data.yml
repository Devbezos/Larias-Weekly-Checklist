name: Update Sheet Data + Upload to Wago & CurseForge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"  # 10:00 AM EST (15:00 UTC)
    - cron: "0 23 * * *"  # 6:00 PM EST  (23:00 UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          set -euo pipefail
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

          if head -n 5 data/spreadsheet.csv | grep -qi "<html"; then
            echo "ERROR: Downloaded HTML instead of CSV (sheet not public or auth required)."
            exit 1
          fi

      - name: Convert CSV to Lua
        run: |
          set -euo pipefail
          python scripts/sheet_to_lua.py data/spreadsheet.csv LariasWeeklyMidnightChecklist_Data.lua

      - name: Commit + bump version + tag (only if Lua changed)
        id: commitstep
        run: |
          set -euo pipefail

          if git diff --quiet -- LariasWeeklyMidnightChecklist_Data.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes. Nothing to release."
            exit 0
          fi

          TOC="LariasWeeklyMidnightChecklist.toc"

          CURRENT_VERSION=$(python -c "import re; t=open('$TOC','r',encoding='utf-8',errors='ignore').read().replace('\r',''); m=re.search(r'^##\\s*Version:\\s*(\\d+)\\.(\\d+)\\.(\\d+)', t, re.M); print('.'.join(m.groups()) if m else '1.0.0')")
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
          TAG="v$NEW_VERSION"

          python -c "import re; p='$TOC'; t=open(p,'r',encoding='utf-8',errors='ignore').read().replace('\r',''); t=re.sub(r'^##\\s*Version:.*$', '## Version: $NEW_VERSION', t, flags=re.M); open(p,'w',encoding='utf-8',newline='\\n').write(t)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add LariasWeeklyMidnightChecklist_Data.lua "$TOC"
          git commit -m "Auto-update checklist data (v$NEW_VERSION)"
          git push

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 1) Build zip + upload to Wago (works)
      - name: Package & Upload to Wago (packager)
        if: steps.commitstep.outputs.changed == 'true'
        continue-on-error: true
        uses: BigWigsMods/packager@v2.4.3
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      # 2) Upload the created zip to CurseForge via API (bypasses packager CF game version lookup)
      - name: Upload to CurseForge (direct API)
        if: steps.commitstep.outputs.changed == 'true'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1448023"
          CURSEFORGE_PAGE: "https://legacy.curseforge.com/wow/addons/larias-weekly-midnight-checklist"
        run: |
          set -euo pipefail

          # Find the zip the packager produced
          ZIP_PATH="$(ls -1 .release/*.zip | head -n 1)"
          if [ -z "${ZIP_PATH}" ]; then
            echo "ERROR: Could not find .release/*.zip"
            ls -la .release || true
            exit 1
          fi
          echo "Using zip: ${ZIP_PATH}"

          # These must be CurseForge "game version IDs".
          # We'll fetch them from the legacy CF Upload API and map by version name.
          # API documented here: /api/game/versions :contentReference[oaicite:1]{index=1}
          VERSIONS_JSON="$(curl -fsSL -H "X-Api-Token: ${CF_API_KEY}" "https://legacy.curseforge.com/api/game/versions")"

          # The versions you want tagged on CurseForge:
          WANT=("12.0.1" "12.0.0" "11.2.7")

          IDS=()
          for v in "${WANT[@]}"; do
            id="$(echo "$VERSIONS_JSON" | jq -r --arg name "$v" '.[] | select(.name==$name) | .id' | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "ERROR: Could not map game version '$v' to a CurseForge ID."
              exit 1
            fi
            IDS+=("$id")
          done

          echo "CurseForge gameVersion IDs: ${IDS[*]}"

          TAG="${{ steps.commitstep.outputs.tag }}"
          if [ -z "${TAG}" ]; then
            TAG="release"
          fi

          # Build metadata for upload-file
          META="$(jq -n \
            --arg changelog "Automated release ${TAG}" \
            --arg displayName "LariasWeeklyMidnightChecklist ${TAG}" \
            --arg releaseType "release" \
            --argjson gameVersions "$(printf '%s\n' "${IDS[@]}" | jq -R . | jq -s .)" \
            '{changelog:$changelog, changelogType:"text", displayName:$displayName, gameVersions:$gameVersions, releaseType:$releaseType}')"

          echo "Uploading to CurseForge project ${CF_PROJECT_ID}..."
          # Upload endpoint documented here: /api/projects/{projectId}/upload-file :contentReference[oaicite:2]{index=2}
          curl -fsSL \
            -H "X-Api-Token: ${CF_API_KEY}" \
            -F "metadata=${META};type=application/json" \
            -F "file=@${ZIP_PATH}" \
            "https://legacy.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"

          echo ""
          echo "CurseForge upload request sent."
          echo "CurseForge page: ${CURSEFORGE_PAGE}"
