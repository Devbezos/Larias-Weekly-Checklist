name: Update Sheet Data -> Lua (daily)

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:10 UTC (00:10 America/Toronto)
    - cron: "10 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet tab as CSV
        run: |
          set -euo pipefail
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          CSV_OUT="data/spreadsheet.csv"

          mkdir -p "$(dirname "$CSV_OUT")"
          URL="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}"

          echo "Fetching: $URL"
          curl -L --fail --silent --show-error "$URL" -o "$CSV_OUT"

          # sanity check so we don't commit an HTML login page
          if head -n 5 "$CSV_OUT" | grep -qi "<html"; then
            echo "ERROR: Downloaded HTML instead of CSV (sheet likely not shared publicly)."
            exit 1
          fi

      - name: Convert CSV -> Lua (keep existing addon format)
        run: |
          set -euo pipefail
          python scripts/sheet_to_lua.py data/spreadsheet.csv LariasWeeklyMidnightChecklist_Data.lua

      - name: Commit only if Lua changed
        run: |
          set -euo pipefail

          if git diff --quiet -- LariasWeeklyMidnightChecklist_Data.lua; then
            echo "No changes in Lua output. Skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add LariasWeeklyMidnightChecklist_Data.lua
          # Optional: also commit the CSV snapshot
          # git add data/spreadsheet.csv

          git commit -m "chore: update checklist data from sheet"
          git push
