name: Update Sheet Data + Upload to CurseForge & Wago

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # runs every hour on the hour (UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          set -euo pipefail
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

      - name: Convert CSV to Lua
        run: |
          python scripts/sheet_to_lua.py data/spreadsheet.csv Locales/enUS_Data.lua

      - name: Update .toc Interface versions (latest 3)
        run: |
          set -euo pipefail

          TOC="LariasWeeklyMidnightChecklist.toc"

          python - <<'PY'
          import json
          import re
          import sys
          import urllib.request
          import urllib.error

          TOC = "LariasWeeklyMidnightChecklist.toc"
          URL = "https://wago.tools/api/builds"

          def interface_from_version(version: str):
            parts = (version or "").split(".")
            if len(parts) < 3:
              return None
            try:
              major, minor, patch = map(int, parts[:3])
            except ValueError:
              return None
            return major * 10000 + minor * 100 + patch

          try:
            req = urllib.request.Request(
              URL,
              headers={
                "User-Agent": "LariasWeeklyMidnightChecklist-GitHubActions/1.0",
                "Accept": "application/json",
              },
            )
            with urllib.request.urlopen(req, timeout=20) as resp:
              data = json.load(resp)
          except urllib.error.HTTPError as e:
            # Wago sometimes blocks anonymous requests from CI (403). Don't hard-fail the workflow.
            print(f"WARNING: Failed to fetch Wago builds from {URL}: HTTP {e.code}. Keeping existing Interface line.", file=sys.stderr)
            raise SystemExit(0)
          except Exception as e:
            print(f"WARNING: Failed to fetch Wago builds from {URL}: {e}. Keeping existing Interface line.", file=sys.stderr)
            raise SystemExit(0)

          retail = data.get("wow")
          if not isinstance(retail, list) or not retail:
            print("Wago response missing 'wow' retail builds", file=sys.stderr)
            raise SystemExit(1)

          interfaces = set()
          for item in retail:
            if not isinstance(item, dict):
              continue
            iface = interface_from_version(str(item.get("version", "")))
            if iface is not None:
              interfaces.add(iface)

          newest = sorted(interfaces, reverse=True)[:3]
          if len(newest) < 3:
            print(f"Expected >= 3 interface versions, got {newest}", file=sys.stderr)
            raise SystemExit(1)

          new_line = "## Interface: " + ", ".join(str(x) for x in newest)

          with open(TOC, "r", encoding="utf-8") as f:
            text = f.read()

          nl = "\r\n" if "\r\n" in text else "\n"
          updated, n = re.subn(r"^##\s*Interface:.*$", new_line, text, flags=re.MULTILINE)
          if n == 0:
            updated = new_line + nl + text

          with open(TOC, "w", encoding="utf-8") as f:
            f.write(updated)
          PY

      - name: Commit + bump version + tag (only if something changed)
        id: commitstep
        run: |
          set -euo pipefail

          TOC="LariasWeeklyMidnightChecklist.toc"

          # Only release when data or toc changed (toc can change due to Interface updates).
          if git diff --quiet -- Locales/enUS_Data.lua "$TOC"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Version: only bump the .toc Version line (no patch-based logic)
          NEW_VERSION=$(python - <<'PY'
          import re

          TOC = "LariasWeeklyMidnightChecklist.toc"

          with open(TOC, "r", encoding="utf-8") as f:
            text = f.read()

          nl = "\r\n" if "\r\n" in text else "\n"

          m = re.search(r"^##\s*Version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)(?:\.([0-9]+))?\s*$", text, flags=re.MULTILINE)
          if m:
            major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
            rev_raw = m.group(4)
            rev = int(rev_raw) if rev_raw is not None else None
            new_rev = (rev + 1) if rev is not None else 1
            new_version = f"{major}.{minor}.{patch}.{new_rev}"
          else:
            new_version = "0.0.0.1"

          new_line = f"## Version: {new_version}"
          updated, n = re.subn(r"^##\s*Version:.*$", new_line, text, flags=re.MULTILINE)
          if n == 0:
            updated = new_line + nl + text

          with open(TOC, "w", encoding="utf-8") as f:
            f.write(updated)

          print(new_version)
          PY
          )

          TAG="v$NEW_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Locales/enUS_Data.lua "$TOC"
          git commit -m "Auto-update addon ($TAG)"
          git push

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package + Upload (CurseForge & Wago)
        if: steps.commitstep.outputs.changed == 'true'
        uses: BigWigsMods/packager@v2.4.3
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Notify Discord (release posted)
        if: steps.commitstep.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.commitstep.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          CURSE_URL="https://www.curseforge.com/wow/addons/larias-weekly-midnight-checklist"

          payload=$(cat <<EOF
          {
            "content": "🚀 **Larias Weekly Midnight Checklist ${TAG}** is live!\n\n📦 GitHub: ${RELEASE_URL}\n🔥 CurseForge: ${CURSE_URL}\n🛠 Workflow: ${RUN_URL}"
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
