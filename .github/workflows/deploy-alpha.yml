name: Deploy Alpha Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  deploy-alpha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: version
        run: |
          # Extract version from .toc file
          CURRENT_VERSION=$(grep "^## Version:" LariasWeeklyMidnightChecklist.toc | sed 's/## Version: //')
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Get branch name
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Check if this is a feature branch (not main/master/develop)
          if [[ "$BRANCH_NAME" =~ ^(main|master|develop|release)$ ]]; then
            echo "error=true" >> $GITHUB_OUTPUT
            echo "::error::Cannot deploy alpha from release branch: $BRANCH_NAME"
            exit 1
          fi

      - name: Calculate new version
        id: newversion
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          # Parse semantic version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          ALPHA_VERSION="$NEW_VERSION-alpha"
          
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "alpha=$ALPHA_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in .toc file
        env:
          ALPHA_VERSION: ${{ steps.newversion.outputs.alpha }}
        run: |
          sed -i "s/^## Version:.*/## Version: $ALPHA_VERSION/" LariasWeeklyMidnightChecklist.toc
          sed -i "s/^## Title:.*/## Title: Larias Weekly Midnight Checklist (ALPHA)/" LariasWeeklyMidnightChecklist.toc

      - name: Commit and tag
        env:
          ALPHA_VERSION: ${{ steps.newversion.outputs.alpha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add LariasWeeklyMidnightChecklist.toc
          git commit -m "Alpha release: $ALPHA_VERSION from ${{ steps.version.outputs.branch }}"
          git push
          
          TAG="v$ALPHA_VERSION"
          git tag -a "$TAG" -m "Alpha Release $ALPHA_VERSION"
          git push origin "$TAG"
          
          echo "tag=$TAG" >> $GITHUB_ENV

      - name: Package + Upload (CurseForge & Wago)
        uses: BigWigsMods/packager@v2.4.3
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Notify Discord (alpha deployed)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: v${{ steps.newversion.outputs.alpha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.version.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          CURSE_URL="https://www.curseforge.com/wow/addons/larias-weekly-midnight-checklist"

          payload=$(cat <<EOF
          {
            "content": "🧪 **Larias Weekly Midnight Checklist ${TAG}** (ALPHA from \`${BRANCH}\`) is ready!\n\n📦 GitHub: ${RELEASE_URL}\n🔥 CurseForge: ${CURSE_URL}\n🛠 Workflow: ${RUN_URL}"
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL" || true
