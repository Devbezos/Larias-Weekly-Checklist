name: Deploy Stable

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a stable release even if no relevant changes were detected"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"   # runs every 5 minutes (UTC)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Google Sheet
        run: |
          set -euo pipefail
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

      - name: Convert CSV to Lua
        run: |
          python scripts/sheet_to_lua.py data/spreadsheet.csv Locales/enUS_Data.lua

      - name: Update .toc Interface versions (latest 3)
        run: |
          set -euo pipefail
          python scripts/update_toc_interface.py --toc LariasWeeklyChecklist.toc --count 3

      - name: Check for release-worthy changes
        id: check
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          TOC="LariasWeeklyChecklist.toc"
          DATA_FILE="Locales/enUS_Data.lua"

          # Read the current version from the toc, stripping any pre-release suffix
          # so we always tag at a clean MAJOR.MINOR.PATCH.
          RAW=$(grep "^## Version:" "$TOC" | sed 's/## Version:[[:space:]]*//')
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "ERROR: could not parse version from toc: $RAW"; exit 1
          fi

          # Normalize toc: strip any alpha suffix, ensure stable title.
          sed -i "s/^## Version:.*/## Version: $VERSION/" "$TOC"
          sed -i "s/^## Title:.*/## Title: Larias's Weekly Checklist/" "$TOC"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          DATA_CHANGED=false
          TOC_CHANGED=false
          if ! git diff --quiet -- "$DATA_FILE"; then DATA_CHANGED=true; fi
          if ! git diff --quiet -- "$TOC";       then TOC_CHANGED=true;  fi

          SHOULD_RELEASE=false
          if [ "${FORCE_DEPLOY:-false}" = "true" ]; then
            SHOULD_RELEASE=true
          elif [ "$DATA_CHANGED" = "true" ]; then
            SHOULD_RELEASE=true
          elif [ "$TOC_CHANGED" = "true" ]; then
            # Release only on a WoW game-version major/minor bump, not a patch.
            OLD_IFACE=$(git show HEAD:"$TOC" | sed -n 's/^## Interface:[[:space:]]*//p' | head -n 1 | cut -d',' -f1 | tr -d '[:space:]' || true)
            NEW_IFACE=$(sed  -n 's/^## Interface:[[:space:]]*//p' "$TOC"           | head -n 1 | cut -d',' -f1 | tr -d '[:space:]' || true)
            if [[ "$OLD_IFACE" =~ ^[0-9]+$ ]] && [[ "$NEW_IFACE" =~ ^[0-9]+$ ]]; then
              OLD_MAJOR=$((OLD_IFACE / 10000)); OLD_MINOR=$(((OLD_IFACE / 100) % 100))
              NEW_MAJOR=$((NEW_IFACE / 10000)); NEW_MINOR=$(((NEW_IFACE / 100) % 100))
              if [ "$OLD_MAJOR" -ne "$NEW_MAJOR" ] || [ "$OLD_MINOR" -ne "$NEW_MINOR" ]; then
                SHOULD_RELEASE=true
              fi
            fi
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Commit data/toc update (no release)
        if: steps.check.outputs.should_release == 'false'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Locales/enUS_Data.lua LariasWeeklyChecklist.toc
          git diff --cached --quiet || { git commit -m "Auto-update data/toc (no release)"; git push; }
          echo "No release conditions met; done."

      - name: Tag at current version, then bump post-release
        if: steps.check.outputs.should_release == 'true'
        id: release
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          TOC="LariasWeeklyChecklist.toc"
          TAG="v$VERSION"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit data + toc at the stable version and tag it.
          git add Locales/enUS_Data.lua "$TOC"
          git diff --cached --quiet || git commit -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push

          # Post-release bump so the branch always starts at the next version.
          NEW_VERSION=$(python scripts/bump_toc_version.py --toc "$TOC")
          git add "$TOC"
          git commit -m "Post-release: bump version to $NEW_VERSION"
          git push

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch tags and reset to release tag for packager
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git reset --hard ${{ steps.release.outputs.tag }}

      - name: Package + Upload (CurseForge & Wago)
        if: steps.check.outputs.should_release == 'true'
        uses: BigWigsMods/packager@v2.4.3
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Notify Discord (release posted)
        if: steps.check.outputs.should_release == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          CF_ID=$(sed -n 's/^curse-project-id:[[:space:]]*//p' .pkgmeta | head -n 1 | tr -d '[:space:]' || true)
          if [ -z "${CF_ID:-}" ]; then CF_ID=0; fi
          CURSE_URL=""
          if [ "${CF_ID}" != "0" ]; then
            if [ -n "${CF_API_KEY:-}" ]; then
              SLUG=$(curl -sS -H "x-api-key: ${CF_API_KEY}" "https://api.curseforge.com/v1/mods/${CF_ID}" \
                | python3 -c "import sys,json; data=json.load(sys.stdin).get('data') or {}; print(data.get('slug',''))" 2>/dev/null || true)
              if [ -n "${SLUG:-}" ]; then
                CURSE_URL="https://www.curseforge.com/wow/addons/${SLUG}"
              fi
            fi
            if [ -z "${CURSE_URL:-}" ]; then
              CURSE_URL="https://www.curseforge.com/wow/search?search=${CF_ID}"
            fi
          fi

          payload=$(cat <<EOF
          {
            "content": " **Larias's Weekly Checklist ${TAG}** is live!\n\n GitHub: ${RELEASE_URL}${CURSE_URL:+\n CurseForge: ${CURSE_URL}}\n Workflow: ${RUN_URL}"
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
