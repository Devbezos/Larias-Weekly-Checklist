name: Deploy Stable

on:
  schedule:
    # GitHub Actions cron uses UTC. We trigger at both 15:00 and 16:00 UTC,
    # then gate the real job so it only proceeds at 11:00 in Toronto.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a stable release even if no relevant changes were detected"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check Toronto schedule window
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TORONTO_HOUR=$(TZ=America/Toronto date +%H)
          if [ "$TORONTO_HOUR" = "11" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Toronto local time is 11:00. Continuing."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Toronto local time is not 11:00. Skipping this UTC cron slot."
          fi

  update:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update .toc Interface versions (latest 3)
        run: |
          set -euo pipefail
          python scripts/update_toc_interface.py --toc LariasWeeklyChecklist.toc --count 3

      - name: Detect TOC-only fast path
        id: precheck
        run: |
          set -euo pipefail
          TOC="LariasWeeklyChecklist.toc"

          # Read the current version from the toc, stripping any pre-release suffix
          # so we always tag at a clean MAJOR.MINOR.PATCH.
          RAW=$(grep "^## Version:" "$TOC" | sed 's/## Version:[[:space:]]*//')
          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "ERROR: could not parse version from toc: $RAW"; exit 1
          fi

          # Normalize toc early so TOC_CHANGED reflects the final toc content.
          sed -i "s/^## Version:.*/## Version: $VERSION/" "$TOC"
          sed -i "s/^## Title:.*/## Title: Larias' Weekly Checklist/" "$TOC"

          TOC_CHANGED=false
          if ! git diff --quiet -- "$TOC"; then TOC_CHANGED=true; fi

          FAST_TOC_ONLY=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$TOC_CHANGED" = "true" ]; then
            FAST_TOC_ONLY=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "toc_changed=$TOC_CHANGED" >> "$GITHUB_OUTPUT"
          echo "fast_toc_only=$FAST_TOC_ONLY" >> "$GITHUB_OUTPUT"

      - name: Download Google Sheet
        if: steps.precheck.outputs.fast_toc_only != 'true'
        run: |
          set -euo pipefail
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"
          mkdir -p data
          curl -L "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

      - name: Convert CSV to Lua
        if: steps.precheck.outputs.fast_toc_only != 'true'
        run: |
          python scripts/sheet_to_lua.py data/spreadsheet.csv Locales/enUS_Data.lua

      - name: Check for release-worthy changes
        id: check
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          TOC="LariasWeeklyChecklist.toc"
          DATA_FILE="Locales/enUS_Data.lua"
          VERSION="${{ steps.precheck.outputs.version }}"
          TOC_CHANGED="${{ steps.precheck.outputs.toc_changed }}"
          FAST_TOC_ONLY="${{ steps.precheck.outputs.fast_toc_only }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          DATA_CHANGED=false
          if [ "$FAST_TOC_ONLY" != "true" ]; then
            if ! git diff --quiet -- "$DATA_FILE"; then DATA_CHANGED=true; fi
            if ! git diff --quiet -- "$TOC";       then TOC_CHANGED=true;  fi
          fi

          LAST_STABLE_TAG=$(git tag --list "v*" --sort=-version:refname | grep -v -- '-alpha$' | head -n 1 || true)
          DAYS_SINCE_LAST_STABLE=99999
          if [ -n "${LAST_STABLE_TAG:-}" ]; then
            LAST_STABLE_TS=$(git for-each-ref --format='%(creatordate:unix)' "refs/tags/${LAST_STABLE_TAG}" | head -n 1)
            NOW_TS=$(date -u +%s)
            DAYS_SINCE_LAST_STABLE=$(( (NOW_TS - LAST_STABLE_TS) / 86400 ))
          fi

          RANGE="HEAD"
          if [ -n "${LAST_STABLE_TAG:-}" ]; then
            RANGE="${LAST_STABLE_TAG}..HEAD"
          fi

          PENDING_BRANCH_CHANGES=false
          PENDING_LINES=$(git log "$RANGE" --pretty=format:"- %s" --no-merges \
            | grep -v -E "^- Post-release:"        \
            | grep -v -E "^- Release v"            \
            | grep -v -E "^- Auto-update data/toc" \
            | grep -v -E "\(#[0-9]+\)$"            \
            | grep -v -E "^- [A-Za-z]+/[^[:space:]]" \
            || true)
          if [ -n "${PENDING_LINES:-}" ]; then
            PENDING_BRANCH_CHANGES=true
          fi

          WEEKLY_BRANCH_RELEASE=false
          if [ "${{ github.event_name }}" = "schedule" ] \
            && [ "$DATA_CHANGED" != "true" ] \
            && [ "$TOC_CHANGED" != "true" ] \
            && [ "$PENDING_BRANCH_CHANGES" = "true" ] \
            && [ "$DAYS_SINCE_LAST_STABLE" -ge 7 ]; then
            WEEKLY_BRANCH_RELEASE=true
          fi

          SHOULD_RELEASE=false
          if [ "$FAST_TOC_ONLY" = "true" ]; then
            SHOULD_RELEASE=true
          elif [ "${FORCE_DEPLOY:-false}" = "true" ]; then
            SHOULD_RELEASE=true
          elif [ "$DATA_CHANGED" = "true" ]; then
            SHOULD_RELEASE=true
          elif [ "$TOC_CHANGED" = "true" ]; then
            # Any Wago-driven Interface version bump should publish a release,
            # including patch bumps like 12.0.5 -> 12.0.7.
            SHOULD_RELEASE=true
          elif [ "$WEEKLY_BRANCH_RELEASE" = "true" ]; then
            SHOULD_RELEASE=true
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "data_changed=$DATA_CHANGED"                   >> "$GITHUB_OUTPUT"
          echo "toc_changed=$TOC_CHANGED"                     >> "$GITHUB_OUTPUT"
          echo "pending_branch_changes=$PENDING_BRANCH_CHANGES" >> "$GITHUB_OUTPUT"
          echo "weekly_branch_release=$WEEKLY_BRANCH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "days_since_last_stable=$DAYS_SINCE_LAST_STABLE" >> "$GITHUB_OUTPUT"

      - name: Commit data/toc update (no release)
        if: steps.check.outputs.should_release == 'false'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          IFACE=$(sed -n 's/^## Interface:[[:space:]]*//p' LariasWeeklyChecklist.toc | head -n 1 | cut -d',' -f1 | tr -d '[:space:]')
          if [[ "$IFACE" =~ ^[0-9]{6}$ ]]; then
            PATCH_VERSION="$((IFACE / 10000)).$(((IFACE / 100) % 100)).$((IFACE % 100))"
          else
            PATCH_VERSION="unknown"
          fi
          git add Locales/enUS_Data.lua LariasWeeklyChecklist.toc
          git diff --cached --quiet || { git commit -m "Automated update addon version for patch ${PATCH_VERSION}"; git push; }
          echo "No release conditions met; done."

      - name: Tag at current version, then bump post-release
        if: steps.check.outputs.should_release == 'true'
        id: release
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          TOC="LariasWeeklyChecklist.toc"
          TAG="v$VERSION"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit data + toc at the stable version and tag it.
          git add Locales/enUS_Data.lua "$TOC"
          git diff --cached --quiet || git commit -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --follow-tags

          # Post-release bump so the branch always starts at the next version.
          NEW_VERSION=$(python scripts/bump_toc_version.py --toc "$TOC")
          git add "$TOC"
          git commit -m "Post-release: bump version to $NEW_VERSION"
          git push

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch tags and reset to release tag for packager
        if: steps.check.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git reset --hard ${{ steps.release.outputs.tag }}

      - name: Generate release changelog
        if: steps.check.outputs.should_release == 'true'
        env:
          VERSION:      ${{ steps.check.outputs.version }}
          DATA_CHANGED: ${{ steps.check.outputs.data_changed }}
          TOC_CHANGED:  ${{ steps.check.outputs.toc_changed }}
        run: |
          set -euo pipefail
          # Find the tag that came before this one so we only log the delta.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Human commits between releases, stripping CI-generated ones.
          HUMAN_LINES=$(git log "$RANGE" --pretty=format:"- %s" --no-merges \
            | grep -v -E "^- Post-release:"       \
            | grep -v -E "^- Release v"           \
            | grep -v -E "^- Auto-update data/toc" \
            | grep -v -E "\(#[0-9]+\)$"           \
            | grep -v -E "^- [A-Za-z]+/[^[:space:]]" \
            || true)

          # If this was a scheduled/automatic data update with no human commits,
          # produce a clear automated message instead of leaving notes blank.
          if [ -z "${HUMAN_LINES:-}" ] && [ "${DATA_CHANGED:-false}" = "true" ]; then
            HUMAN_LINES="- Updated checklist data from spreadsheet"
          fi
          if [ -z "${HUMAN_LINES:-}" ] && [ "${TOC_CHANGED:-false}" = "true" ]; then
            HUMAN_LINES="- Updated interface version for new WoW patch"
          fi

          # Write a keep-a-changelog header so the BigWigsMods packager picks up
          # exactly this section for CurseForge/Wago release notes.
          # Use VERSION from the check step directly — git describe can silently
          # fail after a hard reset, leaving the header as "[unreleased]" which
          # the packager won't match and will fall back to raw git commits.
          DATE=$(date -u +%Y-%m-%d)
          {
            printf '## [%s] - %s\n' "$VERSION" "$DATE"
            printf '%s\n' "${HUMAN_LINES:-}"
          } > CHANGELOG.md

      - name: Package + Upload (CurseForge & Wago)
        if: steps.check.outputs.should_release == 'true'
        uses: BigWigsMods/packager@v2.4.3
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Notify Discord (release posted)
        if: steps.check.outputs.should_release == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          CF_ID=$(sed -n 's/^curse-project-id:[[:space:]]*//p' .pkgmeta | head -n 1 | tr -d '[:space:]' || true)
          if [ -z "${CF_ID:-}" ]; then CF_ID=0; fi
          CURSE_URL=""
          if [ "${CF_ID}" != "0" ]; then
            if [ -n "${CF_API_KEY:-}" ]; then
              SLUG=$(curl -sS -H "x-api-key: ${CF_API_KEY}" "https://api.curseforge.com/v1/mods/${CF_ID}" \
                | python3 -c "import sys,json; data=json.load(sys.stdin).get('data') or {}; print(data.get('slug',''))" 2>/dev/null || true)
              if [ -n "${SLUG:-}" ]; then
                CURSE_URL="https://www.curseforge.com/wow/addons/${SLUG}"
              fi
            fi
            if [ -z "${CURSE_URL:-}" ]; then
              CURSE_URL="https://www.curseforge.com/wow/search?search=${CF_ID}"
            fi
          fi

          payload=$(cat <<EOF
          {
            "content": " **Larias' Weekly Checklist ${TAG}** is live!\n\n GitHub: ${RELEASE_URL}${CURSE_URL:+\n CurseForge: ${CURSE_URL}}\n Workflow: ${RUN_URL}"
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"

      # ── Trigger locale auto-translate after a successful CF release ────────
      # Requires a PAT stored as LOCALES_REPO_TOKEN with repo scope on the
      # locales repo. The token only needs to be set once in the main repo secrets.
      - name: Trigger locale auto-translate
        if: steps.check.outputs.should_release == 'true' && (steps.check.outputs.data_changed == 'true' || github.event.inputs.force == 'true')
        env:
          LOCALES_REPO_TOKEN: ${{ secrets.LOCALES_REPO_TOKEN }}
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${LOCALES_REPO_TOKEN}" \
            https://api.github.com/repos/Devbezos/Larias-Weekly-Checklist_Localization/dispatches \
            -d '{"event_type":"enUS-data-updated"}' \
          | grep -qE '^2' && echo "Dispatch sent." || echo "WARNING: dispatch may have failed (check LOCALES_REPO_TOKEN secret)."
