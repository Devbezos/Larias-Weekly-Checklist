name: Dry Run - Update Sheet Data (no commit/no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dry run update (verbose)
        shell: bash
        run: |
          set -euo pipefail
          set -x

          TOC="LariasWeeklyMidnightChecklist.toc"
          SHEET_ID="1iK2SZUcz_ljnkdTG7KW6pqfzaUDuSgnlh1HupcLrkus"
          GID="53744607"

          echo "==> Downloading Google Sheet CSV"
          mkdir -p data
          curl -fL --show-error --retry 3 --retry-delay 2 \
            "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}" \
            -o data/spreadsheet.csv

          echo "==> Converting CSV to Lua"
          python -u scripts/sheet_to_lua.py data/spreadsheet.csv Locales/enUS_Data.lua

          echo "==> Updating .toc Interface versions (latest 3 from Wago)"
          python -u - <<'PY'
          import json
          import re
          import sys
          import urllib.request
          import urllib.error

          TOC = "LariasWeeklyMidnightChecklist.toc"
          URL = "https://wago.tools/api/builds"

          def interface_from_version(version: str):
              parts = (version or "").split(".")
              if len(parts) < 3:
                  return None
              try:
                  major, minor, patch = map(int, parts[:3])
              except ValueError:
                  return None
              return major * 10000 + minor * 100 + patch

          try:
              req = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent": "LariasWeeklyMidnightChecklist-GitHubActions/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as e:
              print(f"WARNING: Failed to fetch Wago builds from {URL}: HTTP {e.code}. Keeping existing Interface line.", file=sys.stderr)
              raise SystemExit(0)
          except Exception as e:
              print(f"WARNING: Failed to fetch Wago builds from {URL}: {e}. Keeping existing Interface line.", file=sys.stderr)
              raise SystemExit(0)

          retail = data.get("wow")
          if not isinstance(retail, list) or not retail:
              print("ERROR: Wago response missing 'wow' retail builds", file=sys.stderr)
              raise SystemExit(1)

          interfaces = set()
          for item in retail:
              if not isinstance(item, dict):
                  continue
              iface = interface_from_version(str(item.get("version", "")))
              if iface is not None:
                  interfaces.add(iface)

          newest = sorted(interfaces, reverse=True)[:3]
          if len(newest) < 3:
              print(f"ERROR: Expected >= 3 interface versions, got {newest}", file=sys.stderr)
              raise SystemExit(1)

          with open(TOC, "r", encoding="utf-8") as f:
              text = f.read()

          nl = "\r\n" if "\r\n" in text else "\n"

          old_iface = None
          m = re.search(r"^##\s*Interface:.*$", text, flags=re.MULTILINE)
          if m:
              old_iface = m.group(0)

          new_iface = "## Interface: " + ", ".join(str(x) for x in newest)
          text2, n = re.subn(r"^##\s*Interface:.*$", new_iface, text, flags=re.MULTILINE)
          if n == 0:
              text2 = new_iface + nl + text2

          with open(TOC, "w", encoding="utf-8") as f:
              f.write(text2)

          print("-- TOC Interface --")
          if old_iface:
              print(f"old: {old_iface}")
          print(f"new: {new_iface}")
          PY

          echo "==> Checking for changes (data or toc)"
          if git diff --quiet -- Locales/enUS_Data.lua "$TOC"; then
            echo "No changes detected; skipping Version bump."
            git status --porcelain=v1
            exit 0
          fi

          echo "==> Bumping .toc Version (no commit)"
          NEW_VERSION=$(python -u - <<'PY'
          import re

          TOC = "LariasWeeklyMidnightChecklist.toc"

          with open(TOC, "r", encoding="utf-8") as f:
              text = f.read()

          nl = "\r\n" if "\r\n" in text else "\n"

          m = re.search(r"^##\s*Version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)(?:\.([0-9]+))?\s*$", text, flags=re.MULTILINE)
          if m:
              major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
              rev_raw = m.group(4)
              rev = int(rev_raw) if rev_raw is not None else None
              new_rev = (rev + 1) if rev is not None else 1
              new_version = f"{major}.{minor}.{patch}.{new_rev}"
          else:
              new_version = "0.0.0.1"

          new_line = f"## Version: {new_version}"
          updated, n = re.subn(r"^##\s*Version:.*$", new_line, text, flags=re.MULTILINE)
          if n == 0:
              updated = new_line + nl + text

          with open(TOC, "w", encoding="utf-8") as f:
              f.write(updated)

          print(new_version)
          PY
          )

          echo "Dry-run would tag: v$NEW_VERSION"

          echo "==> Git status"
          git status --porcelain=v1

          echo "==> Diff stat"
          git diff --stat

          echo "==> Diff (limited)"
          git diff -- Locales/enUS_Data.lua "$TOC" | sed -n '1,400p'

      - name: Upload dry-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          if-no-files-found: ignore
          path: |
            data/spreadsheet.csv
            Locales/enUS_Data.lua
            LariasWeeklyMidnightChecklist.toc
